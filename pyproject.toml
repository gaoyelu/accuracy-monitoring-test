[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly_middleware"
version = "0.1.0"
description = "vLLM 推理精度异常检测 ASGI 中间件（透明拦截 + 后台检测 + Prometheus 指标）"
readme = "docs/README.md"
requires-python = ">=3.8"
license = { text = "Mulan PSL v2" }
dependencies = [
    "prometheus_client>=0.16",
    "pyyaml>=5.4",
    "numpy>=1.20",
    "httpx>=0.24",
    "colorlog>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "anyio>=3.0",
]

[tool.setuptools]
package-dir = {"anomaly_middleware" = "anomaly_middleware"}
packages = ["anomaly_middleware"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "UP006",
    "UP045",
    "UP037",
    "BLE001",
    "S110",
    "S112",
    "RUF059",
    "RUF012",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM118",
    "SIM103",
    "SIM113",
    "SIM115",
    "SIM105",
    "SIM108",
    "B017",
    "B018",
    "B904",
    "B007",
    "E501",
    "E402",
    "E741",
    "W292",
    "W293",
]
