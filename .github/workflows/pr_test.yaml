name: PR Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    if: ${{ github.event.action != 'labeled' || contains(fromJSON('["ready","ready-for-test"]'), github.event.label.name) }}
    uses: ./.github/workflows/_pre_commit.yaml

  unit-test:
    name: Unit tests (${{ matrix.runner }})
    needs: lint
    if: ${{ always() && needs.lint.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        python-version: ["3.10"]
    uses: ./.github/workflows/_unit_test.yaml
    with:
      runner: ${{ matrix.runner }}
      python-version: ${{ matrix.python-version }}

  e2e-light:
    name: E2E lightweight
    needs: lint
    if: ${{ always() && needs.lint.result == 'success' }}
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      runner: '["ubuntu-latest"]'
      tier: lightweight

  e2e-full:
    name: E2E full
    needs: lint
    if: >-
      ${{ always() && needs.lint.result == 'success'
          && (github.event_name == 'push'
              || (github.event_name == 'pull_request'
                  && (contains(github.event.pull_request.labels.*.name, 'ready')
                      || contains(github.event.pull_request.labels.*.name, 'ready-for-test')))) }}
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      runner: '["ubuntu-latest"]'
      tier: full

  ci-gate:
    name: CI Gate
    needs: [lint, unit-test, e2e-light, e2e-full]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit-test.result }}
          E2EL: ${{ needs.e2e-light.result }}
          E2EF: ${{ needs.e2e-full.result }}
        run: |
          set -eu
          echo "=== PR CI Gate Summary ==="
          echo "lint:          ${LINT}"
          echo "unit-test:     ${UNIT}"
          echo "e2e-light:     ${E2EL}"
          echo "e2e-full:      ${E2EF}"
          for r in "${LINT}" "${UNIT}" "${E2EL}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Required job did not succeed: ${r}"; exit 1 ;;
            esac
          done
          case "${E2EF}" in
            success|skipped) ;;
            *) echo "::error::e2e-full did not succeed: ${E2EF}"; exit 1 ;;
          esac
          echo "=== CI Gate: PASSED ==="
