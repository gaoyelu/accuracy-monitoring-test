name: Lint

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout; empty = event default"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint deps
        run: pip install ruff

      - name: Ruff lint
        run: ruff check anomaly_middleware/ tests/ --output-format=github

      - name: Ruff format check
        run: ruff format --check anomaly_middleware/ tests/
