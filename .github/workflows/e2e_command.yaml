name: E2E Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: e2e-command-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.event.issue.pull_request != null && github.event.comment.user.type == 'User' && startsWith(github.event.comment.body, '/e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.issue.number }}
        run: |
          set -eu
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}")
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login')
          {
            echo "pr_number=${PR_NUM}"
            echo "head_sha=${HEAD_SHA}"
            echo "pr_author=${PR_AUTHOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Parse tier from comment
        id: tier
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -eu
          TIER="full"
          if echo "$COMMENT" | grep -qi "/e2e nightly"; then
            TIER="nightly"
          elif echo "$COMMENT" | grep -qi "/e2e full"; then
            TIER="full"
          elif echo "$COMMENT" | grep -qi "/e2e light"; then
            TIER="lightweight"
          fi
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"

      - name: Check authorization
        id: auth
        env:
          ACTOR: ${{ github.event.comment.user.login }}
          PR_AUTHOR: ${{ steps.pr.outputs.pr_author }}
          ASSOC: ${{ github.event.comment.author_association }}
        run: |
          set -eu
          if [ "${ACTOR,,}" = "${PR_AUTHOR,,}" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Reject unauthorized
        if: always() && steps.auth.outputs.authorized != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body "/e2e denied — only PR author or triage+ can trigger."

      - name: Notify trigger
        if: always() && steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body "/e2e triggered: ${TIER} tier will run on PR head."

  e2e:
    needs: resolve
    if: always() && needs.resolve.outputs.authorized == 'true'
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      runner: '["ubuntu-latest"]'
      tier: ${{ needs.resolve.outputs.tier }}
      ref: ${{ needs.resolve.outputs.head_sha }}
