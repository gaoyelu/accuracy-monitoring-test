name: Unit Tests

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      ref:
        description: "Git ref to checkout; empty = event default"
        type: string
        default: ""
      python-version:
        type: string
        default: "3.10"

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests (${{ inputs.runner }}, py${{ inputs.python-version }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ inputs.python-version }}-

      - name: Install project + test deps
        run: |
          pip install -e ".[test]"
          pip install pytest pytest-asyncio httpx anyio

      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/e2e \
            -x -q --tb=short \
            --junitxml=unit_test_junit.xml \
            2>&1 | tee unit_test_run.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ contains(inputs.runner, 'arm') && 'arm64' || 'x86' }}-py${{ inputs.python-version }}
          path: |
            unit_test_run.log
            unit_test_junit.xml
          if-no-files-found: ignore
          retention-days: 7
